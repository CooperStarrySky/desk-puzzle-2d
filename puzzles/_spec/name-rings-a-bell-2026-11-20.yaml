title: "Name Rings a Bell"
id: "name-rings-a-bell-2026-11-20"
date: "2026-11-20"
images: "../name-rings-a-bell-2026-11-20-src/"

groups:
  - id: "g-potential-causes-of-shock"
    name: "Potential causes of shock"
    tier: 1  # Easy
    explanation: "One of each of the four main causes of shock: hypovolemic, cardiogenic, obstructive, and distributive"
    credit:
      name: "Jacob"
    article:
      - type: "text"
        text: "<i>Images: https://radiopaedia.org/articles/tension-pneumothorax; https://www.wikidoc.org/index.php/Papillary_muscle_rupture; https://www.amboss.com/us/knowledge/penetrating-trauma</i>"
    items:
      - id: "sepsis"
        label: "Sepsis"
        zone: "corkboard"
        note: "Sepsis is a frequent etiology of distributive shock"
      - id: "tension-pneumothorax"
        label: "Tension pneumothorax"
        zone: "tubes"
        note: "One of the complications of a tension pneumothorax is obstructive shock"
        image: "tension-pneumothorax-info.webp"
        source: "https://radiopaedia.org/articles/tension-pneumothorax"
      - id: "papillary-muscle-rupture"
        label: "Papillary muscle rupture"
        zone: "photo"
        note: "Papillary muscle rupture can lead to acute mitral regurgitation and cardiogenic shock"
        image: "papillary-muscle-rupture-info.webp"
        source: "https://www.wikidoc.org/index.php/Papillary_muscle_rupture"
      - id: "penetrating-trauma"
        label: "Penetrating trauma"
        zone: "photo"
        note: "Penetrating trauma is a common cause of hypovolemic/hemorrhagic shock"
        image: "penetrating-trauma-info.webp"
        source: "https://www.amboss.com/us/knowledge/penetrating-trauma"
  - id: "g-wilson-disease"
    name: "Wilson Disease"
    tier: 2  # Medium
    explanation: "Associated with diagnosis or treatment of Wilson Disease"
    credit:
      anonymous: true
    article:
      - type: "text"
        text: "<i>Images: https://encyclopedia.pub/entry/26244; https://www.webpathology.com/images/gastrointestinal/liver/inherited-metabolic-and-develop-disorders/42901; https://radiopaedia.org/articles/hepatomegaly</i>"
    items:
      - id: "low-ceruloplasmin"
        label: "Low ceruloplasmin"
        zone: "folder"
        note: "Usually evident in late childhood or early adolescence, these rings develop due to excess copper deposition on the inner surface of the cornea within the Descemet membrane"
        source: "https://encyclopedia.pub/entry/26244"
      - id: "steatosis"
        label: "Steatosis"
        zone: "rack"
        scope_image: "steatosis-scope.webp"
        source: "https://www.webpathology.com/images/gastrointestinal/liver/inherited-metabolic-and-develop-disorders/42901"
      - id: "hepatomegaly-on-x-ray"
        label: "Hepatomegaly on X-Ray"
        zone: "tubes"
        image: "hepatomegaly-on-x-ray-info.webp"
        source: "https://radiopaedia.org/articles/hepatomegaly"
      - id: "zinc-acetate"
        label: "Zinc acetate"
        zone: "rx"
        note: "Zinc (such as zinc acetate or Galzin) blocks the intestines from absorbing copper from your food. It is commonly used for maintenance treatment after initial copper levels have been safely lowered, or for asymptomatic patients."
  - id: "g-things-with-hallmark-signs-related-to-rings"
    name: "Things with hallmark signs related to rings"
    tier: 3  # Hard
    explanation: "All of these conditions, Wilson's disease, Bronchiectasis, Toxoplasmosis, Gastric adenocarcinoma have a hallmark sign that is associated with rings"
    credit:
      name: "Jacob + Liz"
      line: "MS2"
    article:
      - type: "text"
        text: "<i>Images: Adobe Stock Images; Curious clinicians; Radiopaedia; Neuroradiology</i>"
    items:
      - id: "signet-rings-in-gastric-adenocarcinoma"
        label: "Signet Rings in gastric adenocarcinoma"
        zone: "rack"
        note: "\"signet rings\" on H&E stain is the hallmark sign of an aggressive diffuse-type of adenocarcinoma of the stomach, the ring appearance due to the mucin pushing the nucleus to the periphery"
        scope_image: "signet-rings-in-gastric-adenocarcinoma-scope.jpg"
        source: "Adobe Stock Images"
      - id: "kayser-fleischer-rings"
        label: "Kayser-Fleischer Rings"
        zone: "photo"
        note: "Kayser-Fleischer rings are characteristic of Wilson's disease and are due to deposits of copper within Descemet's membrane"
        image: "kayser-fleischer-rings-info.jpg"
        source: "Curious clinicians"
      - id: "signet-rings-in-bronchiectasis"
        label: "Signet rings in bronchiectasis"
        zone: "tubes"
        note: "Signet rings on CT scan can be a classic sign of bronchiectasis"
        image: "signet-rings-in-bronchiectasis-info.jpg"
        source: "Radiopaedia"
      - id: "ring-enhancing-lesions-on-ct"
        label: "Ring-enhancing lesions on CT"
        zone: "tubes"
        note: "Cerebral toxoplasmosis is the most common cause of intracranial ring-enhancing lesions in immunocompromised patients"
        image: "ring-enhancing-lesions-on-ct-info.jpg"
        source: "Neuroradiology"
  - id: "g-cells-named-after-people"
    name: "Cells named after people"
    tier: 4  # Hardest
    explanation: "Each clue points to a cell that carries someone's name."
    credit:
      anonymous: true
    article:
      - type: "text"
        text: "All four are cells with a person's name attached, and each one points to a specific disease or organ."
      - type: "text"
        text: "CD15+ and CD30+: the immunostain profile of the Reed-Sternberg cell (named for Dorothy Reed and Carl Sternberg). It is the large binucleate owl-eye cell of classical Hodgkin lymphoma; the nodular lymphocyte-predominant type lacks classic Reed-Sternberg cells."
      - type: "text"
        text: "Heart slide: Anitschkow cells (Nikolai Anitschkow), activated macrophages whose chromatin bunches into a wavy bar, the caterpillar nucleus. They sit inside Aschoff bodies, the granulomas of rheumatic myocarditis after group A strep pharyngitis."
      - type: "text"
        text: "Liver slide, iron stain: a Kupffer cell (Karl von Kupffer), the resident macrophage lining the hepatic sinusoids. It has eaten iron, which the Prussian blue stain shows as blue granules."
      - type: "text"
        text: "Langhans giant cell (Theodor Langhans): macrophages fused into one large cell with nuclei arranged in a horseshoe at the edge. It is typical of granulomas, especially caseating granulomas in tuberculosis. Not to be confused with Langerhans cells of the skin."
      - type: "text"
        text: "<i>Images: Wikimedia Commons, \"Anitschkow Myocytes in an Aschoff Body, Rheumatic Myocarditis\", Ed Uthman, MD, CC BY-SA 2.0; Wikimedia Commons, \"Kupffer cell with hemosiderin and hepatocyte with lipofuscin, iron stain, original\", Mikael Häggström, MD, CC0</i>"
    anki: [1481335636086, 1472058685014, 1486776332176, 1503252725841]
    items:
      - id: "cd15-and-cd30"
        label: "CD15+ and CD30+"
        zone: "corkboard"
        note: "Reed-Sternberg cell, the owl-eye cell of Hodgkin lymphoma."
      - id: "heart-h-e"
        label: "Heart, H&E"
        zone: "rack"
        note: "Anitschkow cell: the caterpillar nucleus, inside Aschoff bodies of rheumatic myocarditis."
        scope_image: "heart-h-e-scope.webp"
        source: "Wikimedia Commons, \"Anitschkow Myocytes in an Aschoff Body, Rheumatic Myocarditis\", Ed Uthman, MD, CC BY-SA 2.0"
      - id: "liver-iron-stain"
        label: "Liver, iron stain"
        zone: "rack"
        note: "Kupffer cell, the resident macrophage of the liver sinusoids. Iron stain turns the hemosiderin it has eaten blue."
        scope_image: "liver-iron-stain-scope.webp"
        source: "Wikimedia Commons, \"Kupffer cell with hemosiderin and hepatocyte with lipofuscin, iron stain, original\", Mikael Häggström, MD, CC0"
      - id: "langhans-giant-cell"
        label: "Langhans giant cell"
        zone: "corkboard"
        note: "Named for Theodor Langhans. Horseshoe of nuclei, found in granulomas such as TB."
