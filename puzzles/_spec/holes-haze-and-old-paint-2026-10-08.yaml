# Puzzle 3 from the planning doc (2026-10-08)
#
# Groups (Thirth's final picks, "Puzzle 3" tab of the planning Google Doc):
#   tier 1  Asthma triggers
#   tier 2  Lead poisoning
#   tier 3  Causes of hemoptysis
#   tier 4  Pathology described with cheese words
#
# Crossovers on purpose: caseous necrosis (cheese) points at TB (hemoptysis);
# air pollution (asthma) and the emphysema lung both smell of smoke; the
# blood smear and the parasite egg both sit on the microscope.
#
# Images: originals (pre-cropped to the portrait photo / film frames) live in
# ../holes-haze-and-old-paint-2026-10-08-src/ and stay untracked. All come
# from the planning doc except the emphysema lung (CDC, public domain, via
# Wikimedia Commons: File:Centrilobular emphysema 865 lores.jpg). The doc's
# own "Swiss cheese" image is a CT with honeycombing, not emphysema.
#
# Anki: AnKing Step 1 notes (#AK_Step1_v12, AnKingOverhaul model). Several
# carry AnkiHub optional tags (#PANCE, AnkiHub_Optional) or Thirth's CMSRU
# lecture mirror tags, which are not in-house content (same call as 9/24).
# No note appears in an earlier puzzle.
#
# Build check: python3 tools/build_puzzle.py puzzles/_spec/holes-haze-and-old-paint-2026-10-08.yaml

title: Holes, Haze, and Old Paint
id: holes-haze-and-old-paint-2026-10-08
date: 2026-10-08
images: ../holes-haze-and-old-paint-2026-10-08-src/

groups:
  # -- tier 1 : asthma triggers ---------------------------------------------
  - id: g-asthma-triggers
    name: Things that set off an asthma attack
    tier: 1
    explanation: >
      Each one can tighten twitchy asthmatic airways: hard exercise, a common painkiller, dirty air, and a viral infection.
    article:
      - type: text
        text: "<b>Exercise</b>: Breathing fast through the mouth dries and cools the airways, which can trigger exercise-induced bronchoconstriction."
      - type: text
        text: "<b>Aspirin</b>: Blocking COX shunts arachidonic acid toward leukotrienes, which squeeze the airways. This is aspirin-exacerbated respiratory disease (asthma, nasal polyps, aspirin sensitivity)."
      - type: text
        text: "<b>Air pollution</b>: Ozone, smoke, and fine particles irritate the airway lining."
      - type: text
        text: "<b>Influenza</b>: Viral respiratory infections are among the most common causes of asthma flares."
    anki:
      - 1473628085810  # asthma: allergic stimuli, also viral URIs and stress
      - 1496178435881  # bronchospasm + nasal congestion after aspirin = AERD
      - 1488847719405  # aspirin pseudoallergy from excess leukotriene synthesis
      - 1578177770190  # exercise-induced asthma -> SABA
    items:
      - label: Exercise
        zone: photo
        title: Exercise
        text: "Track clue: fast, cold, dry breathing during a hard run can tighten the airways a few minutes in."
        image: runners.jpg

      - label: Aspirin
        zone: rx
        title: Aspirin
        text: "Rx clue: a COX inhibitor. With COX blocked, more arachidonic acid goes to leukotrienes."

      - label: Air pollution
        zone: corkboard
        title: Air pollution
        text: "Weather clue: a smoggy, high-ozone day sends more patients to the ER wheezing."

      - label: Influenza virus
        zone: photo
        title: Influenza
        text: "Virus clue: an enveloped RNA virus with hemagglutinin and neuraminidase spikes."
        image: influenza-virus.jpg

  # -- tier 2 : lead poisoning ----------------------------------------------
  - id: g-lead-poisoning
    name: Lead poisoning
    tier: 2
    explanation: >
      One poison seen four ways: its treatment, a line on the gums, a speckled red cell, and what it does to a child's brain.
    article:
      - type: text
        text: "<b>CaNa<sub>2</sub>EDTA</b>: A chelator that binds lead so the kidneys can clear it. Severe cases add dimercaprol, and milder cases in children often get oral succimer."
      - type: text
        text: "<b>Gum line</b>: Burton lines, a blue-gray band of lead deposits along the gum margin."
      - type: text
        text: "<b>Blood smear</b>: Microcytic anemia with basophilic stippling. Lead blocks ferrochelatase and ALA dehydratase, so heme isn't made, and it leaves clumps of ribosomal RNA in the red cells."
      - type: text
        text: "<b>Neurodevelopmental delay</b>: Young children absorb lead easily, often from old paint, and it harms the developing brain."
    anki:
      - 1550690823657  # succimer, dimercaprol, CaNa2EDTA treat lead poisoning
      - 1522980892976  # bluish pigmentation at the gum-tooth line
      - 1489974129598  # basophilic stippling on smear
      - 1489975262057  # children + lead paint -> mental deterioration
    items:
      - label: "CaNa₂EDTA"
        id: cana2edta
        zone: rx
        title: Calcium disodium EDTA
        text: "Rx clue: a chelating agent given by injection to pull a heavy metal out of the body."

      - label: Blue-gray gum line
        zone: photo
        title: Burton lines
        text: "Exam clue: a thin blue-gray line where the gums meet the teeth."
        image: lead-lines-gums.jpg

      - label: Blood smear
        zone: rack
        title: Basophilic stippling
        text: "Smear clue: small, pale red cells, one dotted with fine blue granules."
        scope_image: basophilic-stippling.jpg

      - label: "Neuro\u00addevelopmental delay"
        id: neurodevelopmental-delay
        zone: corkboard
        title: Neurodevelopmental delay
        text: "Peds clue: a toddler who is slow to talk, living in a house built before 1978."

  # -- tier 3 : causes of hemoptysis ----------------------------------------
  - id: g-hemoptysis
    name: Causes of hemoptysis
    tier: 3
    explanation: >
      All four can make a patient cough up blood: scarred, widened airways, a lung fluke, an old cavity, and antibodies against basement membrane.
    article:
      - type: text
        text: "<b>Chest CT</b>: Bronchiectasis. Chronic infection and inflammation leave airways permanently widened, and their enlarged bronchial arteries bleed."
      - type: text
        text: "<b>Wet mount</b>: Paragonimus westermani, the lung fluke from undercooked crab or crayfish. Its operculated eggs show up in sputum or stool, and it can mimic TB."
      - type: text
        text: "<b>Chest X-ray</b>: Tuberculosis. Reactivation disease cavitates in the upper lobes and causes cough, night sweats, and hemoptysis."
      - type: text
        text: "<b>Goodpasture syndrome</b>: Anti-GBM antibodies attack type IV collagen in both the lungs and the kidneys, so it causes hemoptysis plus hematuria."
    anki:
      - 1473628206194  # bronchiectasis: dyspnea, hemoptysis, purulent sputum
      - 1509933949416  # Paragonimus: chronic cough with hemoptysis
      - 1509934173819  # Paragonimus: operculated eggs
      - 1503254435421  # reactivated TB: cough, night sweats, hemoptysis
      - 1475376577258  # Goodpasture: hematuria and hemoptysis
    items:
      - label: Chest CT
        zone: tubes
        title: Bronchiectasis
        text: "Imaging clue: thick-walled airways wider than the arteries beside them, with years of foul, purulent sputum."
        image: bronchiectasis-ct.jpg

      - label: Wet mount
        zone: rack
        title: Paragonimus westermani
        text: "Microscope clue: a golden-brown egg with a lid (operculum), after a meal of raw freshwater crab."
        scope_image: paragonimus-egg.jpg

      - label: Chest X-ray
        zone: tubes
        title: Tuberculosis
        text: "Imaging clue: an upper-lobe opacity in a patient with night sweats and weight loss."
        image: tb-chest-xray.jpg

      - label: "Good\u00adpasture syndrome"
        id: goodpasture-syndrome
        zone: corkboard
        title: Goodpasture syndrome

  # -- tier 4 : cheese words -------------------------------------------------
  - id: g-cheese
    name: Pathology described with cheese words
    tier: 4
    explanation: >
      Each one is described in textbooks with a cheese: Swiss cheese brain, cottage cheese discharge, cheesy (caseous) necrosis, and a Swiss cheese lung.
    article:
      - type: text
        text: "<b>Brain MRI</b>: Neurocysticercosis. Many small Taenia solium cysts give the brain a \"Swiss cheese\" look on CT or MRI."
      - type: text
        text: "<b>Candidiasis</b>: Thick, white, \"cottage cheese\" discharge with itching and a normal vaginal pH."
      - type: text
        text: "<b>Caseous necrosis</b>: The crumbly, white, cheese-like center of a TB or fungal granuloma. <i>Caseus</i> is Latin for cheese."
      - type: text
        text: "<b>Emphysema</b>: Destroyed alveolar walls leave enlarged air spaces, so the cut lung looks full of holes."
    anki:
      - 1509925987471  # neurocysticercosis "swiss cheese" brain on CT/MRI
      - 1548722722283  # "cottage cheese" discharge = Candida
      - 1487469944925  # caseous necrosis: "cottage cheese-like"
      - 1473627940622  # emphysema: destruction of alveolar air sacs
    items:
      - label: Brain MRI
        zone: tubes
        title: Neurocysticercosis
        text: "Imaging clue: dozens of small cysts scattered through the brain of a patient with new seizures."
        image: neurocysticercosis.jpg

      - label: Candidiasis
        zone: corkboard
        title: Candidiasis

      - label: Caseous necrosis
        zone: photo
        title: Caseous necrosis
        text: "Gross clue: a soft, crumbly, pale yellow-white center inside a lung lesion."
        image: caseous-necrosis.jpg

      - label: Emphysematous lung
        zone: photo
        title: Emphysema
        text: "Gross clue: a smoker's lung with many enlarged, empty air spaces in the upper lobe."
        image: emphysema-lung.jpg
